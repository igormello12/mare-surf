    :root, [data-theme="light"] {

      --color-bg: #0d2230;
      --color-surface: #112b3b;
      --color-surface-2: #153547;
      --color-surface-offset: #193f54;
      --color-border: rgba(232,244,248,.12);
      --color-divider: rgba(232,244,248,.08);
      --color-text: #eaf5f8;
      --color-text-muted: #b8d1d8;
      --color-text-faint: #86aab5;

      --color-primary: #5ab3c0;

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; -webkit-font-smoothing:antialiased; }
    body { font-family:var(--font-body); font-size:var(--text-base); background:var(--color-bg); color:var(--color-text); line-height:1.6; min-height:100dvh; }

    a,button,[role="button"] { transition:color var(--transition),background var(--transition),border-color var(--transition),box-shadow var(--transition),transform var(--transition); }

    /* HEADER */

    .brand { display:flex;align-items:center;gap:.8rem; }
    .brand-mark { width:42px;height:42px;display:grid;place-items:center;flex-shrink:0;background:none !important;border-radius:0 !important; }
    .brand-mark svg { width:42px;height:42px; }
    .brand-name { font-family:var(--font-display);font-size:1.45rem;line-height:1; }
    .brand-tag { font-size:var(--text-xs);color:var(--color-text-muted); }

    nav a { font-size:var(--text-sm);color:var(--color-text-muted); }

    .header-actions { display:flex;align-items:center;gap:.75rem; }
    .theme-toggle { min-width:44px;min-height:44px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-surface-2);padding:.75rem;display:grid;place-items:center; }
    .theme-toggle:hover { background:var(--color-surface-offset); }
    .nav-cta { min-height:44px;padding:.75rem 1.15rem;border-radius:var(--radius-full);background:var(--color-primary);color:var(--color-text-inverse);font-size:var(--text-sm); }
    .nav-cta:hover { background:var(--color-primary-hover); }

    /* UTILITIES */
    .eyebrow { display:inline-flex;gap:.5rem;align-items:center;padding:.4rem .8rem;border-radius:var(--radius-full);background:var(--color-surface);border:1px solid var(--color-border);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--color-primary); }
    .pill { font-size:var(--text-xs);padding:.3rem .65rem;border-radius:var(--radius-full);background:color-mix(in srgb,var(--color-secondary) 12%,var(--color-surface));color:var(--color-primary); }
    .pill-row { display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:var(--space-3); }
    .btn { display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.9rem 1.25rem;border-radius:var(--radius-full);font-size:var(--text-sm);font-family:var(--font-body); }
    .btn-primary { background:var(--color-primary);color:var(--color-text-inverse); }
    .btn-primary:hover { background:var(--color-primary-hover);transform:translateY(-1px); }
    .btn-secondary { border:1px solid var(--color-border);background:var(--color-surface-2); }
    .btn-secondary:hover { background:var(--color-surface-offset); }
    .section { padding:clamp(3.5rem,7vw,6rem) 0; }
    .section-head { display:flex;justify-content:space-between;gap:var(--space-4);align-items:flex-end;margin-bottom:var(--space-8);flex-wrap:wrap; }
    .section-head p { max-width:54ch;color:var(--color-text-muted);margin:0; }

    /* HERO */
    .hero { padding:clamp(4rem,9vw,8rem) 0 var(--space-16); }
    .hero-grid { display:grid;gap:var(--space-8);align-items:center;grid-template-columns:1.1fr .9fr; }
    .hero h1 { max-width:14ch;margin:var(--space-4) 0; }
    .hero p { max-width:56ch;color:var(--color-text-muted); }
    .hero-actions { display:flex;gap:1rem;flex-wrap:wrap;margin-top:var(--space-6); }
    .hero-card { background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-6);box-shadow:var(--shadow-md);position:relative;overflow:hidden; }
    .wave { position:absolute;inset:auto -5% -20% auto;width:70%;height:55%;background:radial-gradient(circle at top left,rgba(93,202,165,.3),transparent 55%),radial-gradient(circle at center,rgba(26,143,160,.18),transparent 65%);filter:blur(24px);pointer-events:none; }
    .stats { display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-top:var(--space-5); }
    .stat { padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-border); }

    /* DESTINATIONS GRID */
    .destinations-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5); }
    .card { display:block; background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-sm); }

    .card-media::after { content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(11,77,107,.3)); }
    .card-body { padding:var(--space-5); }
    .card p { color:var(--color-text-muted);font-size:var(--text-sm);margin-top:var(--space-2); }

    /* FEATURE / SOBRE */
    .feature-layout { display:grid;grid-template-columns:1.25fr .75fr;gap:var(--space-6); }
    .feature-main,.feature-side { background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-6);box-shadow:var(--shadow-sm); }
    .feature-main p { color:var(--color-text-muted);margin-bottom:var(--space-5); }
    .quote { padding:var(--space-6);border-left:3px solid var(--color-accent);background:color-mix(in srgb,var(--color-accent) 8%,var(--color-surface));border-radius:0 var(--radius-lg) var(--radius-lg) 0;font-family:var(--font-display);font-size:var(--text-lg);line-height:1.45;color:var(--color-text);font-style:italic;margin-top:var(--space-5); }
    .timeline { display:grid;gap:var(--space-4); }
    .timeline-item { padding-bottom:var(--space-4);border-bottom:1px solid var(--color-divider); }
    .timeline-item:last-child { border-bottom:none;padding-bottom:0; }
    .timeline-item strong { display:block;margin-bottom:var(--space-1); }
    .timeline-item .detail-list { font-size:var(--text-sm);color:var(--color-text-muted); }

    /* DESTINO FLORIPA */
    .destination-hero-layout { display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);align-items:start; }
    .destination-copy p { color:var(--color-text-muted);margin-bottom:var(--space-5); }
    .detail-grid { display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4); }
    .detail-box { background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4); }
    .detail-box strong { display:block;margin-bottom:var(--space-1);color:var(--color-primary); }
    .detail-box span { font-size:var(--text-sm);color:var(--color-text-muted); }
    .destination-image { border-radius:var(--radius-xl);min-height:420px;background-size:cover;background-position:center;box-shadow:var(--shadow-md); }

    /* FOOTER */
    .footer { padding:var(--space-10) 0 var(--space-16);border-top:1px solid var(--color-divider); }
    .footer-row { display:flex;justify-content:space-between;gap:var(--space-6);flex-wrap:wrap; }
    .footer-brand .brand-name { font-size:1.8rem; }
    .footer-brand p { color:var(--color-text-muted);margin-top:var(--space-2);max-width:42ch; }
    .footer-mascot { color:var(--color-text-muted);font-size:var(--text-sm);max-width:28ch;text-align:right; }

    /* RESPONSIVE */
    @media (max-width:980px) {
      .hero-grid,.feature-layout,.destination-hero-layout,.destinations-grid { grid-template-columns:1fr; }
      .stats { grid-template-columns:repeat(3,1fr); }
    }
    @media (max-width:640px) {
      .header-row { flex-direction:column;align-items:flex-start; }
      nav ul { gap:var(--space-4); }
      .hero-actions { flex-direction:column; }
      .hero-actions .btn { width:100%;justify-content:center; }
      .stats,.detail-grid { grid-template-columns:1fr 1fr; }
      .footer-row { flex-direction:column; }
      .footer-mascot { text-align:left; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important;transition-duration:.01ms !important; } html { scroll-behavior:auto; } }
  </style>
